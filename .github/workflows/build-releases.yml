name: Build release artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=android
      - name: Set Android app label
        run: sed -i 's/android:label="parm_mail"/android:label="Parmtech Mail"/' android/app/src/main/AndroidManifest.xml
      - name: Prepare Android network and notification runtime
        run: python3 tool/prepare_android.py
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: parmtech-mail-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=ios
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qr "$GITHUB_WORKSPACE/ParmTech-Mail-iOS-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: parmtech-mail-ios-unsigned
          path: ParmTech-Mail-iOS-unsigned.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=windows
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ParmTech-Mail-Windows.zip
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not found: $compiler" }
          $sourceDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $outputDir = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $compiler "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" windows\installer\ParmtechMail.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: parmtech-mail-windows
          path: |
            ParmTech-Mail-Windows.zip
            artifacts/ParmTech-Mail-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter create . --platforms=linux
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf ParmTech-Mail-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: parmtech-mail-linux-x64
          path: ParmTech-Mail-Linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=macos
      - run: flutter pub get
      - run: flutter build macos --release
      - run: hdiutil create -volname "ParmTech Mail" -srcfolder build/macos/Build/Products/Release/parm_mail.app -ov -format UDZO ParmTech-Mail-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: parmtech-mail-macos
          path: ParmTech-Mail-macOS.dmg
