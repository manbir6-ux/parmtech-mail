name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: flutter create . --platforms=android,ios,windows,macos,linux
      - name: Prepare generated Android project
        run: python3 tool/prepare_android.py
      - name: Test Android build preparation
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
