name: parm_mail
description: ParmTech cross-platform cPanel email client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  enough_mail: ^2.1.7
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10
  tray_manager: ^0.8.0
  window_manager: ^0.5.2
  file_picker: ^13.1.0
  cryptography: ^2.9.0
  printing: ^5.14.2
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/parmtech-mark.png
